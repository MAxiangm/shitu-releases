<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic 采集助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icon.png" alt=""><div><h1>Mosaic</h1><p>浏览器采集</p></div></header>
  <section class="connection"><span id="statusDot" class="dot"></span><strong id="status">正在查找 Mosaic…</strong><button id="check" type="button">重新检测</button></section>
  <section class="gesture"><kbd>Alt</kbd><b>＋</b><span>鼠标右键</span><p>在网页播放器、视频文件链接或图片上点击即可采集。<br>看到“已保存”后，可在 Mosaic 的“最近导入”查看。</p></section>
  <section class="destination"><label for="captureFolder">保存到</label><select id="captureFolder" aria-describedby="folderNote" disabled><option value="">未分类</option></select><p id="folderNote" role="status" hidden></p></section>
  <section class="browser-sessions" aria-label="当前浏览器登录"><div class="browser-session"><strong>YouTube</strong><button id="youtubeSessionToggle" type="button" disabled>使用当前 YouTube 登录</button><p id="youtubeSessionStatus" role="status">正在检查…</p></div><div class="browser-session"><strong>Bilibili</strong><button id="bilibiliSessionToggle" type="button" disabled>使用当前 Bilibili 登录</button><p id="bilibiliSessionStatus" role="status">正在检查…</p></div></section>
  <section class="automatic"><strong>打开 Mosaic 后自动连接</strong><p id="feedback" role="status">正在查找本机运行中的 Mosaic…</p></section>
  <section id="recent" class="recent" hidden><span id="recentLabel">上次采集结果</span><button id="recentClear" type="button" title="清除记录，不会取消正在进行的采集">清除记录</button><p id="recentText"></p><progress id="recentProgress" aria-label="素材下载进度" hidden></progress><button id="locateRecent" type="button" hidden>在 Mosaic 中查看</button><p id="locateNote" role="status" hidden></p></section>
  <footer>采集助手 0.11.28<br>支持 Sketchfab 官方可下载模型，以及 YouTube、Bilibili、Pinterest、Instagram、X 和 Vimeo 的可读取视频。<br>采集文件最大 512 MB；普通网页内读取最大 20 MB。</footer>
  <script src="popup.js"></script>
</body>
</html>
