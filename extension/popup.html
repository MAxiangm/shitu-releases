<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic 采集助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icon.png" alt=""><div><h1>Mosaic</h1><p>浏览器采集</p></div></header>
  <section class="connection"><span id="statusDot" class="dot"></span><strong id="status">正在查找 Mosaic…</strong><button id="check" type="button">重新检测</button></section>
  <section class="gesture"><kbd>Alt</kbd><b>＋</b><span>鼠标右键</span><p>在图片或直链视频上点击，开始采集。<br>看到“已保存”后才表示素材库确认入库。</p></section>
  <section class="automatic"><strong>打开 Mosaic 后自动连接</strong><p id="feedback" role="status">正在查找本机运行中的 Mosaic…</p></section>
  <section id="recent" class="recent" hidden><span id="recentLabel">上次采集结果</span><button id="recentClear" type="button" title="清除记录，不会取消正在进行的采集">清除记录</button><p id="recentText"></p></section>
  <footer>采集助手 0.11.1 · 只传输到本机，不上传云端。<br>浏览器图片读取上限 20 MB，大图交由桌面下载。<br>暂不支持 DRM、直播和分段流视频。</footer>
  <script src="popup.js"></script>
</body>
</html>
