name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Skip a version already published with complete verified assets
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('build', 'true');
            if (context.eventName === 'workflow_dispatch') return;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(tag)) return;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data; }
            catch (error) { if (error.status === 404) return; throw error; }
            if (release.draft || release.prerelease || release.tag_name !== tag) return;
            const manifests = release.assets.filter(asset => asset.name === 'shitu-update.json');
            if (manifests.length !== 1) return;
            const asset = manifests[0], version = tag.slice(1);
            const prefix = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${encodeURIComponent(tag)}/`;
            if (asset.state !== 'uploaded' || asset.size < 1 || asset.size > 65536 || asset.browser_download_url !== prefix + 'shitu-update.json') return;
            const response = await fetch(asset.browser_download_url + '?shitu_preflight=' + Date.now(), {
              cache: 'no-store', headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(30000)
            });
            if (!response.ok || !response.body) throw new Error(`Existing release manifest is not publicly readable: HTTP ${response.status}`);
            const chunks = []; let bytes = 0;
            for await (const chunk of response.body) {
              bytes += chunk.length;
              if (bytes > 65536) throw new Error('Existing release manifest exceeds the allowed size');
              chunks.push(Buffer.from(chunk));
            }
            const buffer = Buffer.concat(chunks);
            const digest = require('node:crypto').createHash('sha256').update(buffer).digest('hex');
            if (asset.size !== buffer.length || asset.digest !== `sha256:${digest}`) throw new Error('Existing release manifest digest mismatch');
            const manifest = JSON.parse(buffer.toString('utf8'));
            const installer = manifest.installer;
            if (manifest.schemaVersion !== 1 || manifest.version !== version || manifest.platform !== 'win32' || manifest.arch !== 'x64' ||
                installer?.name !== `shitu-${version}-setup.exe` || !Number.isSafeInteger(installer.size) || installer.size < 2 || installer.size > 2147483648 || !/^[a-f0-9]{64}$/.test(installer.sha256 || '')) return;
            const files = release.assets.filter(item => item.name === installer.name);
            if (files.length !== 1 || files[0].state !== 'uploaded' || files[0].size !== installer.size ||
                files[0].digest !== `sha256:${installer.sha256}` || files[0].browser_download_url !== prefix + installer.name) return;
            core.setOutput('build', 'false');
            core.notice(`${tag} is already public with complete matching update assets; preserving the existing release.`);
  windows:
    needs: preflight
    # The first installer is built and published locally to bootstrap later CI.
    if: needs.preflight.outputs.build == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name != 'v0.10.8')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must be $expected" }
      - name: Restore pinned binary dependency cache
        id: resources
        uses: actions/cache@v4
        with:
          path: |
            .recovery/extracted-0.10.7
            .recovery/runtime
            ai-runtime
            node_modules
            video-runtime
          key: shitu-windows-binaries-${{ hashFiles('build-resources.json', 'video-runtime-manifest.json') }}
      - name: Restore binary dependencies from verified first release
        if: steps.resources.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\7-Zip\7z.exe')) { choco install 7zip --yes --no-progress }
          node scripts/prepare-build-resources.cjs
      - name: Prepare video decoder and DXV test samples
        run: |
          node scripts/prepare-video-runtime.cjs
          node scripts/prepare-video-test-fixtures.cjs
      - name: Prepare verified model test samples
        run: node scripts/prepare-model-test-fixtures.cjs
      - name: Prepare verified font test samples
        run: node scripts/prepare-font-test-fixtures.cjs
      - name: Check source
        run: node scripts/check.cjs
      - name: Run unit tests
        run: npm test
      - name: Smoke test application
        run: node scripts/smoke.cjs
      - name: Smoke test renderer crash recovery
        run: node scripts/smoke-ui-recovery.cjs
      - name: Smoke test nested folders and hierarchy persistence
        run: node scripts/smoke-folders.cjs
      - name: Smoke test dropdown and pinned folder panel
        run: node scripts/smoke-folder-panel.cjs
      - name: Smoke test font import and preview
        run: node scripts/smoke-font.cjs
      - name: Smoke test single and multiple assets dragged into folders
        run: node scripts/smoke-asset-drag.cjs
      - name: Smoke test metadata undo and redo
        run: node scripts/smoke-undo.cjs
      - name: Smoke test asset and folder color labels
        run: node scripts/smoke-colors.cjs
      - name: Smoke test browser capture and saved receipts
        run: node scripts/smoke-collector.cjs
      - name: Smoke test AE package storage and folder export
        run: node scripts/smoke-ae.cjs
      - name: Smoke test update without executing an installer
        run: node scripts/smoke-update.cjs
      - name: Smoke test real video decoding and preview
        run: node scripts/smoke-video.cjs
      - name: Smoke test batch video transcoding
        run: node scripts/smoke-transcode.cjs
      - name: Smoke test video thumbnail hover playback
        run: node scripts/smoke-hover-video.cjs
      - name: Smoke test model packaging and interactive preview
        run: |
          node scripts/smoke-model.cjs
          node scripts/smoke-model-viewer.cjs
      - name: Ensure NSIS compiler
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install nsis --yes --no-progress }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler is unavailable' }
          "MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer and update manifest
        run: node scripts/build-installer.cjs
      - name: Publish complete release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github.cjs --publish
      - name: Upload manual validation build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: shitu-windows-validation-${{ github.run_id }}
          path: |
            dist/shitu-*-setup.exe
            dist/shitu-update.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


